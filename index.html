<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Табло Boost Camp</title><meta name="description" content="План и факт четырёх команд Boost Camp за 12–14 октября: Акулы, Львы, Быки, Киты. Цель кемпа — $2 500 000."><meta name="robots" content="noindex,nofollow"><meta property="og:title" content="Табло Boost Camp"><meta property="og:description" content="План и факт четырёх команд Boost Camp за 12–14 октября: Акулы, Львы, Быки, Киты. Цель кемпа — $2 500 000."><meta name="theme-color" content="#16171C"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%222%22 y=%222%22 width=%2228%22 height=%2228%22 rx=%228%22 fill=%22none%22 stroke=%22%23FC550E%22 stroke-width=%223%22/%3E%3Cpath d=%22M7 17h4l2-5 3 10 3-12 2 7h4%22 fill=%22none%22 stroke=%22%23FC550E%22 stroke-width=%222.4%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"><style>/* Layout: табло ралли — сверху оранжевая панель «путь к цели $2.5M», ниже рейтинг команд, дни и сверочная таблица */
:root{
  --bg:#16171C; --card:#1B1D25; --card-2:#20232C; --line:#272A33; --line-2:#343844;
  --glow:#2A1C1B;
  --o1:#FC550E; --o2:#D03C00; --o-ink:#FF8A52;
  --fg:#FAF9FE; --fg-2:#CFCFDB; --muted:#9592A8; --label:#A29FB1;
  --plan:#6E7282; --track:#252831;
  --glow-2:#1F1A1C; --now-line:#7A3A1C; --inp:#14151A; --banner:#24180F; --scrim:rgba(8,9,12,.72); --on-o:#16171C;
  --o-btn:#D03C00; --o-btn-h:#B83400;
  --gold:#FBCC49; --silver:#D8DDE3; --bronze:#DA965C;
  --bad:#FF7A6B;
  --font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:24px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  background:var(--bg);
  background-image:radial-gradient(1200px 520px at 100% 0%,var(--glow),transparent 60%),radial-gradient(900px 420px at 0% 100%,var(--glow-2),transparent 60%);
  background-attachment:fixed;
  color:var(--fg); font-family:var(--font); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
button,input,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:20px 48px;display:flex;flex-direction:column;gap:28px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{display:block;width:132px;height:36px;background:var(--logo) left center/contain no-repeat}
.top-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.crumb{color:var(--label);font-size:13px;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:transparent;color:var(--fg);font-weight:600;font-size:14px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{background:var(--card-2);border-color:var(--plan)}
.btn:focus-visible,.seg button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--o1);outline-offset:2px}
.btn-o{background:var(--o-btn);border-color:transparent;color:#fff}
.btn-o:hover{background:var(--o-btn-h);border-color:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.btn-sm{min-height:34px;padding:0 12px;font-size:13px}

/* heading */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px 24px;flex-wrap:wrap}
.head h1{margin:0;font-size:clamp(28px,4.4vw,44px);line-height:1.08;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.head p{margin:8px 0 0;color:var(--fg-2);font-size:15px}
.seg{display:inline-flex;padding:4px;border:1px solid var(--line);border-radius:999px;background:var(--card);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--fg-2);font-weight:600;font-size:14px;min-height:36px;padding:0 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.seg button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--o1);margin-left:6px;vertical-align:middle}

/* hero */
.hero{border-radius:var(--r-xl);background:linear-gradient(180deg,var(--o1),var(--o2));padding:clamp(20px,3.4vw,36px);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 32px;align-items:end;color:#fff}
.hero .eyebrow{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--on-o)}
.hero .big{font-size:clamp(40px,8vw,84px);font-weight:800;line-height:1;letter-spacing:-.03em;margin-top:10px}
.hero .of{font-size:clamp(19px,2vw,20px);font-weight:700;margin-top:8px}
.hero .pct{font-size:clamp(40px,7vw,72px);font-weight:800;line-height:1;text-align:right;letter-spacing:-.03em}
.hero .pct small{display:block;font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--on-o);margin-top:6px}
.hero-bar{grid-column:1/-1;display:flex;flex-direction:column;gap:10px}
.gbar{position:relative;height:18px;border-radius:999px;background:rgba(22,23,28,.28);overflow:hidden;display:flex;gap:2px}
.gbar i{display:block;height:100%;background:#fff;border-radius:0}
.gbar i:first-child{border-radius:999px 0 0 999px}
.gbar i:last-of-type{border-radius:0 999px 999px 0}
.gbar i:only-of-type{border-radius:999px}
.gbar i.d1{opacity:1}.gbar i.d2{opacity:.78}.gbar i.d3{opacity:.58}
.hero-legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;font-weight:700}
.hero-legend span{display:inline-flex;align-items:center;gap:6px}
.hero-legend b{font-weight:800}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;background:#fff}
.sw.d2{opacity:.78}.sw.d3{opacity:.58}
.hero-note{grid-column:1/-1;font-size:15px;font-weight:600;margin:0}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:var(--r-xl);background:var(--card);padding:18px 20px;min-width:0}
.kpi .k{font-size:13px;color:var(--label);font-weight:600}
.kpi .v{font-size:clamp(20px,2.6vw,28px);font-weight:800;margin-top:4px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:13px;color:var(--muted);margin-top:2px}
.kpi .v.o{color:var(--o-ink)}

/* sections */
.sec{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap}
.sec-h h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.sec-h .say,.sec>.say{color:var(--fg-2);font-size:15px;margin:0}
.legend{display:flex;gap:16px;font-size:13px;color:var(--fg-2);font-weight:500}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-f{width:14px;height:8px;border-radius:4px;background:linear-gradient(180deg,var(--o1),var(--o2))}
.lg-p{width:14px;height:8px;border-radius:4px;background:var(--plan)}
.lg-t{width:2px;height:14px;background:var(--fg)}

/* team board */
.board{border:1px solid var(--line);border-radius:var(--r-xl);background:var(--card);overflow:hidden}
.team{display:grid;grid-template-columns:44px minmax(0,1.1fr) minmax(0,1.6fr) 200px;gap:14px 20px;align-items:center;padding:18px 22px;border-top:1px solid var(--line)}
.team:first-child{border-top:0}
.medal{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:16px;color:var(--on-o);background:var(--card-2);border:1px solid var(--line-2)}
.medal.m1{background:radial-gradient(circle at 35% 30%,#FFE08A,var(--gold));border:0}
.medal.m2{background:radial-gradient(circle at 35% 30%,#fff,var(--silver));border:0}
.medal.m3{background:radial-gradient(circle at 35% 30%,#F3B985,var(--bronze));border:0}
.medal.m0{color:var(--fg-2)}
.tname{font-size:20px;font-weight:800;line-height:1.15}
.tname em{font-style:normal;color:var(--label);font-weight:600}
.tcap{font-size:13px;color:var(--muted);margin-top:2px}
.tnums{text-align:right;white-space:nowrap}
.tnums .f{font-size:22px;font-weight:800}
.tnums .p{font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;border:1px solid var(--line-2);color:var(--fg-2);white-space:nowrap;margin-top:6px}
.chip.ok{background:var(--o-btn);border-color:transparent;color:#fff}
.chip.mute{color:var(--muted)}
.chip.now{border-color:var(--o1);color:var(--o-ink)}

/* bars */
.bar{position:relative;height:12px;border-radius:999px;background:var(--track)}
.bar .pl{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--plan)}
.bar .fa{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:linear-gradient(180deg,var(--o1),var(--o2));min-width:8px}
.bar .tk{position:absolute;top:-5px;bottom:-5px;width:2px;margin-left:-1px;background:var(--fg);border-radius:1px;box-shadow:0 0 0 2px var(--card)}
.days-mini{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.days-mini b{color:var(--fg-2);font-weight:700}

/* days */
.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.day{border:1px solid var(--line);border-radius:var(--r-xl);background:var(--card);padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.day.is-now{border-color:var(--now-line)}
.day .dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.day .dd{font-size:20px;font-weight:800}
.day .dt{font-size:13px;color:var(--muted)}
.day .chip{margin-top:0}
.day .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.day .row .f{font-size:26px;font-weight:800;letter-spacing:-.01em}
.day .row .pp{font-size:20px;font-weight:800;color:var(--o-ink)}
.day .row .pp.dim{color:var(--muted)}
.day .sub{font-size:13px;color:var(--muted)}
.day .best{font-size:13px;color:var(--fg-2);border-top:1px solid var(--line);padding-top:10px}

/* matrix */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-xl);background:var(--card)}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:12px 16px;text-align:right;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
thead th{border-top:0;font-size:12px;color:var(--label);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
thead th.now{color:var(--o-ink)}
th:first-child,td:first-child{text-align:left}
td .f{font-weight:800;font-size:15px}
td .p{font-size:12px;color:var(--muted)}
td .pc{font-size:12px;font-weight:700;color:var(--fg-2)}
td .pc.ok{color:var(--o-ink)}
tfoot td{border-top:1px solid var(--line-2);background:var(--card-2)}
td.tn{font-weight:800}
td.tn small{display:block;font-weight:500;color:var(--muted);font-size:12px}

.foot{color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:16px}
.foot b{color:var(--fg-2);font-weight:600}

/* lock */
.lock{min-height:100vh;display:grid;place-items:center;padding-inline:16px;padding-block:40px}
.lock-card{width:100%;max-width:420px;border:1px solid var(--line);border-radius:var(--r-xl);background:var(--card);padding:28px;display:flex;flex-direction:column;gap:18px}
.lock-card h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.lock-card h1 span{color:var(--o-ink)}
.lock-card p{margin:0;color:var(--fg-2)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--label)}
.inp{width:100%;min-height:44px;padding:0 14px;border-radius:var(--r-md);border:1px solid var(--line-2);background:var(--inp);color:var(--fg);font-size:16px}
.inp::placeholder{color:#858298}
.err{color:var(--bad);font-size:14px;margin:0;min-height:1.5em}
.lock-meta{font-size:12px;color:var(--muted)}
.lock-card .logo{width:160px;height:44px}

/* banner */
.banner{border:1px solid var(--o2);border-radius:var(--r-lg);background:var(--banner);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}

/* editor */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;justify-content:flex-end}
.sheet{width:100%;max-width:620px;height:100%;background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column}
.sh-h{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 16px;border-bottom:1px solid var(--line)}
.sh-h h2{margin:0;font-size:20px;font-weight:800}
.sh-b{flex:1;overflow-y:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:20px}
.sh-f{border-top:1px solid var(--line);padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sh-f .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.status{font-size:14px;color:var(--fg-2);margin:0;min-height:1.5em}
.status.bad{color:var(--bad)}
.ed-grid{display:flex;flex-direction:column;gap:10px}
.ed-row{display:grid;grid-template-columns:minmax(0,1fr) 150px 150px;gap:10px;align-items:start;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card);padding:12px 14px}
.ed-row .tname{font-size:17px}
.ed-row .field label{font-size:12px}
.hint{font-size:12px;color:var(--muted);min-height:1.4em}
.hint.bad{color:var(--bad)}
.ed-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
details{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--card)}
summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";float:right;color:var(--muted);font-weight:600}
details[open] summary::after{content:"–"}
.det-b{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.det-b p{margin:0;font-size:13px;color:var(--fg-2)}
.det-b code{font-family:var(--font);background:var(--card-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:1px 6px;font-size:13px}
textarea.inp{min-height:120px;padding:10px 14px;resize:vertical;font-size:14px;line-height:1.5}
.plist{margin:0;padding-left:18px;font-size:13px;color:var(--fg-2)}
.plist .bad{color:var(--bad)}
.helper{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}

@media (max-width:860px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .days{grid-template-columns:minmax(0,1fr)}
  .team{grid-template-columns:40px minmax(0,1fr) auto;padding:16px}
  .team .tnums{grid-column:3;grid-row:1}
  .team .tbar{grid-column:1/-1;grid-row:2}
}
@media (max-width:520px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero .pct{text-align:left}
  .ed-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .ed-row .who{grid-column:1/-1}
  .seg{width:100%}
  .seg button{flex:1;padding:0 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* публичная версия: синхронизация, журнал, тост */
.sync{font-size:13px;color:var(--muted);font-weight:500}
.sync.bad{color:var(--bad)}
.log{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r-xl);background:var(--card);overflow:hidden}
.log li{display:grid;grid-template-columns:130px 160px minmax(0,1fr);gap:6px 16px;padding:10px 18px;border-top:1px solid var(--line);font-size:13px;color:var(--fg-2)}
.log li:first-child{border-top:0}
.log .lt{color:var(--muted)}
.log .lw{color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log .lc{display:block}
.log .lc span{margin-left:10px;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);font-weight:700;font-size:14px;padding:10px 18px;border-radius:999px;z-index:30}
@media (max-width:640px){.log li{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.log .lc{grid-column:1/-1}}

    if (rest.length >= 3) {
      const d = matchDay(rest[0]);
      if (!d) { out.bad.push({ n: i + 1, line, why: 'дата должна быть 12, 13 или 14' }); return; }
      date = d; rest = rest.slice(1);
    }
    if (!rest.length || rest.every(c => c === '')) { out.bad.push({ n: i + 1, line, why: 'нет чисел' }); return; }
    const plan = rest[0] === undefined || rest[0] === '' ? undefined : parseMoney(rest[0]);
    const fact = rest[1] === undefined || rest[1] === '' ? undefined : parseMoney(rest[1]);
    if (Number.isNaN(plan) || Number.isNaN(fact)) { out.bad.push({ n: i + 1, line, why: 'не разобрал число' }); return; }
    out.ok.push({ tid, date, plan, fact });
  });
  return out;
}

/* ---------- data ---------- */
function blankValues(data) {
  const src = data || S, v = {};
  for (const t of src.teams) { v[t.id] = {}; for (const d of src.days) v[t.id][d.date] = { plan: null, fact: null }; }
  return v;
}
function normalize(data) {
  const v = blankValues(data);
  for (const t of data.teams) for (const d of data.days) {
    const c = ((data.values || {})[t.id] || {})[d.date] || {};
    v[t.id][d.date] = { plan: isNum(c.plan) ? c.plan : null, fact: isNum(c.fact) ? c.fact : null };
  }
  data.values = v;
  data.goal = isNum(data.goal) ? data.goal : 0;
  return data;
}
const cell = (tid, date) => S.values[tid][date];
function sum(arr) { let s = null; for (const v of arr) if (isNum(v)) s = (s || 0) + v; return s; }
function teamAgg(tid, dates) { return { plan: sum(dates.map(d => cell(tid, d).plan)), fact: sum(dates.map(d => cell(tid, d).fact)) }; }
function dayAgg(date) { return { plan: sum(S.teams.map(t => cell(t.id, date).plan)), fact: sum(S.teams.map(t => cell(t.id, date).fact)) }; }
const allDates = () => S.days.map(d => d.date);
const scopeDates = () => scope === 'all' ? allDates() : [scope];
function dayState(date) { const t = todayISO(); return date < t ? 'past' : date === t ? 'now' : 'future'; }
const dayOf = date => S.days.find(d => d.date === date);
function hasAnyData() { return S.teams.some(t => S.days.some(d => { const c = cell(t.id, d.date); return isNum(c.plan) || isNum(c.fact); })); }

/* ---------- pieces ---------- */
function chip(plan, fact) {
  if (!isNum(plan) && !isNum(fact)) return '<span class="chip mute">нет данных</span>';
  if (!isNum(fact)) return '<span class="chip mute">ждём факт</span>';
  if (!(plan > 0)) return '<span class="chip">без плана</span>';
  const p = fact / plan * 100;
  if (p >= 100) return '<span class="chip ok">план выполнен · ' + Math.round(p) + '%</span>';
  return '<span class="chip">' + Math.round(p) + '% плана</span>';
}
function bar(plan, fact, max, label) {
  if (!(max > 0) || (!(plan > 0) && !(fact > 0))) return '<div class="bar" role="img" aria-label="' + esc(label + ': данных нет') + '"></div>';
  const w = v => Math.max(0, Math.min(100, (v || 0) / max * 100)).toFixed(2);
  const tip = 'Факт ' + money(fact) + ' · план ' + money(plan);
  let h = '<div class="bar" role="img" aria-label="' + esc(label + ': ' + tip) + '" title="' + esc(tip) + '">';
  if (plan > 0) h += '<span class="pl" style="width:' + w(plan) + '%"></span>';
  if (fact > 0) h += '<span class="fa" style="width:' + w(fact) + '%"></span>';
  if (plan > 0) h += '<span class="tk" style="left:' + w(plan) + '%"></span>';
  return h + '</div>';
}
function legend() { return '<div class="legend" aria-hidden="true"><span><i class="lg-f"></i>факт</span><span><i class="lg-p"></i>план</span><span><i class="lg-t"></i>отметка плана</span></div>'; }

/* ---------- views ---------- */
const num = v => (v === null || v === undefined || v === '') ? null : (isFinite(+v) ? +v : null);
function applyServer(j) {
  const v = blankValues(S);
  let upd = null, by = null;
  for (const r of (j.rows || [])) {
    if (!v[r.team_id] || !v[r.team_id][r.day]) continue;
    v[r.team_id][r.day] = { plan: num(r.plan), fact: num(r.fact) };
    if (r.updated_at && (!upd || r.updated_at > upd)) { upd = r.updated_at; by = r.updated_by || null; }
  }
  if (j.goal && isNum(+j.goal.value)) { S.goal = +j.goal.value; if (j.goal.updated_at && (!upd || j.goal.updated_at > upd)) { upd = j.goal.updated_at; by = j.goal.updated_by || null; } }
  S.values = v; S.updatedAt = upd; S.updatedBy = by;
  log = Array.isArray(j.log) ? j.log : [];
}
async function load() {
  if (loading) return;
  loading = true;
  try {
    const r = await fetch(API, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    applyServer(await r.json());
    loaded = true; loadErr = null; lastSync = new Date();
  } catch (e) { loadErr = e; }
  loading = false;
  renderMain();
}
function syncText() {
  if (!lastSync) return loadErr ? 'нет связи с базой' : 'загружаю…';
  const t = new Intl.DateTimeFormat('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(lastSync);
  return (loadErr ? 'нет связи · последние данные от ' : 'синхронизировано в ') + t;
}

  const be = document.getElementById('b-edit'); if (be) be.addEventListener('click', () => openEditor());
  const be2 = document.getElementById('b-edit-2'); if (be2) be2.addEventListener('click', () => openEditor());

}

function heroHtml() {
  const goal = S.goal || 0;
  const facts = S.days.map(d => dayAgg(d.date).fact || 0);
  const total = facts.reduce((a, b) => a + b, 0);
  const p = goal > 0 ? total / goal * 100 : null;
  const left = Math.max(0, goal - total);
  let acc = 0, segs = '';
  if (goal > 0) facts.forEach((f, i) => { if (f > 0 && acc < 100) { const w = Math.min(f / goal * 100, 100 - acc); acc += w; segs += '<i class="d' + (i + 1) + '" style="width:' + w.toFixed(2) + '%" title="' + esc(S.days[i].label + ': ' + money(f)) + '"></i>'; } });
  const t = todayISO();
  const remain = S.days.filter(d => d.date > t || (d.date === t && !isNum(dayAgg(d.date).fact))).length;
  let note;
  if (!(goal > 0)) note = 'Цель кемпа не задана.';
  else if (total >= goal) note = 'Цель кемпа взята: на ' + money(total - goal) + ' больше плана.';
  else if (total === 0) note = 'Факт ещё не внесён. Цель — ' + money(goal) + ' за три дня.';
  else if (remain > 1) note = 'До цели ' + money(left) + ': это ' + money(left / remain) + ' в день на оставшиеся ' + remain + ' ' + plural(remain, 'день', 'дня', 'дней') + '.';
  else if (remain === 1) note = 'До цели ' + money(left) + ' — их нужно добрать за последний день.';
  else if (S.days[S.days.length - 1].date === t) note = 'Последний день кемпа: до цели ' + money(left) + '.';
  else note = 'Кемп завершён. До цели не хватило ' + money(left) + '.';
  return '<section class="hero" aria-label="Путь к цели кемпа">' +
    '<div><div class="eyebrow">Цель Boost Camp · все дни</div><div class="big num">' + money(total) + '</div><div class="of num">из ' + money(goal) + '</div></div>' +
    '<div class="pct num">' + pctTxt(p) + '<small>цели выполнено</small></div>' +
    '<div class="hero-bar"><div class="gbar" role="img" aria-label="' + esc('Факт ' + money(total) + ' из ' + money(goal)) + '">' + segs + '</div>' +
    '<div class="hero-legend num">' + S.days.map((d, i) => '<span><i class="sw d' + (i + 1) + '"></i>' + esc(d.short) + ' <b>' + money(dayAgg(d.date).fact) + '</b></span>').join('') + '</div></div>' +
    '<p class="hero-note">' + esc(note) + '</p></section>';
}

function kpiHtml() {
  const ds = scopeDates();
  const plan = sum(S.teams.map(t => teamAgg(t.id, ds).plan));
  const fact = sum(S.teams.map(t => teamAgg(t.id, ds).fact));
  const p = pctOf(fact, plan);
  const diff = (isNum(plan) && isNum(fact)) ? fact - plan : null;
  const lbl = scope === 'all' ? 'за три дня' : dayOf(scope).label;
  let planSub = lbl;
  if (scope === 'all') {
    const t = todayISO();
    const toDate = sum(S.teams.map(tm => teamAgg(tm.id, allDates().filter(d => d <= t)).plan));
    if (isNum(toDate) && S.days.some(d => d.date > t) && S.days.some(d => d.date <= t)) planSub = 'по плану на сегодня ' + money(toDate);
  }
  const tile = (k, v, s, o) => '<div class="kpi"><div class="k">' + k + '</div><div class="v num' + (o ? ' o' : '') + '">' + v + '</div><div class="s num">' + esc(s) + '</div></div>';
  return '<section class="kpis" aria-label="Сводка за период">' +
    tile('План', money(plan), planSub) +
    tile('Факт', money(fact), 'все четыре команды', true) +
    tile('Выполнение', pctTxt(p), p == null ? 'нужны план и факт' : p >= 100 ? 'план выполнен' : 'осталось ' + money(plan - fact)) +
    tile('Разница с планом', diff == null ? '—' : (diff >= 0 ? '+' : '−') + money(Math.abs(diff)), diff == null ? '—' : diff >= 0 ? 'выше плана' : 'ниже плана') +
    '</section>';
}

function teamsHtml() {
  const ds = scopeDates();
  const rows = S.teams.map(t => Object.assign({ t }, teamAgg(t.id, ds)));
  const max = Math.max(0, ...rows.map(r => Math.max(r.plan || 0, r.fact || 0)));
  const sorted = rows.slice().sort((a, b) => ((b.fact ?? -1) - (a.fact ?? -1)) || ((pctOf(b.fact, b.plan) ?? -1) - (pctOf(a.fact, a.plan) ?? -1)));
  const lead = sorted[0];
  const done = rows.filter(r => r.plan > 0 && isNum(r.fact) && r.fact >= r.plan).length;
  const withPlan = rows.filter(r => r.plan > 0 && isNum(r.fact)).length;
  let say = 'Рейтинг появится, когда будет внесён факт.';
  if (lead && lead.fact > 0) {
    const lp = pctOf(lead.fact, lead.plan);
    say = 'Лидируют ' + lead.t.name + ': ' + money(lead.fact) + (lp != null ? ', ' + Math.round(lp) + '% плана' : '') + '.';
    if (withPlan) say += ' План выполнили ' + done + ' из ' + withPlan + '.';
  }
  let h = '<section class="sec" aria-labelledby="h-teams"><div class="sec-h"><h2 id="h-teams">Команды' + (scope === 'all' ? '' : ' · ' + esc(dayOf(scope).label)) + '</h2>' + legend() + '</div><p class="say">' + esc(say) + '</p><div class="board">';
  sorted.forEach((r, i) => {
    const rank = r.fact > 0 ? i + 1 : null;
    const mcls = rank && rank <= 3 ? 'm' + rank : 'm0';
    let mini = '';
    if (scope === 'all') mini = '<div class="days-mini num">' + S.days.map(d => '<span>' + esc(d.short) + ' <b>' + money(cell(r.t.id, d.date).fact) + '</b></span>').join('') + '</div>';
    h += '<div class="team"><div class="medal ' + mcls + ' num" aria-label="' + (rank ? rank + ' место' : 'без места') + '">' + (rank || '–') + '</div>' +
      '<div><div class="tname">' + esc(r.t.name) + ' <em>' + esc(r.t.epithet || '') + '</em></div><div class="tcap">Капитан — ' + esc(r.t.captain) + '</div></div>' +
      '<div class="tbar">' + bar(r.plan, r.fact, max, r.t.name) + mini + '</div>' +
      '<div class="tnums num"><div class="f">' + money(r.fact) + '</div><div class="p">план ' + money(r.plan) + '</div>' + chip(r.plan, r.fact) + '</div></div>';
  });
  return h + '</div></section>';
}

function daysHtml() {
  const aggs = S.days.map(d => Object.assign({ d }, dayAgg(d.date)));
  const max = Math.max(0, ...aggs.map(a => Math.max(a.plan || 0, a.fact || 0)));
  const scored = aggs.filter(a => pctOf(a.fact, a.plan) != null);

      const bp = pctOf(b.fact, b.plan);

      '<div class="row num"><span class="f">' + money(a.fact) + '</span><span class="pp' + (p == null ? ' dim' : '') + '">' + pctTxt(p) + '</span></div>' +

/* ---------- editor ---------- */
function edFrom(src) {
  const values = JSON.parse(JSON.stringify((src && src.values) || S.values));
  const base = blankValues();
  for (const t of S.teams) for (const d of S.days) {
    const c = ((values[t.id] || {})[d.date]) || {};
    base[t.id][d.date] = { plan: isNum(c.plan) ? c.plan : null, fact: isNum(c.fact) ? c.fact : null };
  }
  const t = todayISO();
  return { day: dayOf(t) ? t : S.days[0].date, values: base, goal: isNum(src && src.goal) ? src.goal : S.goal, bad: {}, report: '' };

  if (!host) { host = document.createElement('div'); host.id = 'bc-editor'; document.body.appendChild(host); }
  host.innerHTML =
    '<div class="scrim" id="ed-scrim"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ed-title">' +
    '<div class="sh-h"><h2 id="ed-title">Внести данные</h2><button class="btn btn-sm" id="ed-x" type="button">Закрыть</button></div>' +
    '<div class="sh-b">' +
      '<div class="field"><label for="ed-by">Кто вносит</label><input class="inp" id="ed-by" autocomplete="name" maxlength="40" placeholder="Например, Сергей · Акулы" value="' + esc(lsGet(K_NAME) || '') + '"><div class="hint">Имя попадёт в журнал изменений.</div></div>' +
      '<div class="ed-head"><div class="field"><label for="ed-goal">Цель кемпа за три дня, $</label><input class="inp num" id="ed-goal" inputmode="decimal" autocomplete="off" value="' + (isNum(ed.goal) ? nf.format(ed.goal) : '') + '"><div class="hint" id="ed-goal-h"></div></div></div>' +
      '<div class="seg" role="group" aria-label="День" id="ed-days">' + S.days.map(d => '<button type="button" data-edday="' + d.date + '" aria-pressed="' + (d.date === ed.day) + '">' + esc(d.short) + '</button>').join('') + '</div>' +
      '<div class="ed-grid" id="ed-grid">' + edRows() + '</div>' +
      '<div class="helper"><button class="btn btn-sm" id="ed-even" type="button">Заполнить пустые планы поровну</button><span class="num" id="ed-even-n">по ' + money(evenShare()) + ' на команду в день</span></div>' +
      '<details id="ed-paste-box"><summary>Вставить из таблицы</summary><div class="det-b">' +
        '<p>Скопируйте строки из Google Таблиц или напишите по строке на команду: <code>Акулы; 250 000; 180 000</code> — план и факт для выбранного дня. Чтобы указать день, добавьте его после команды: <code>Киты; 13; 300к; 320к</code>. Команду можно назвать фамилией капитана. Пустая ячейка не меняет значение.</p>' +
        '<label class="hint" for="ed-paste" style="color:var(--label);font-weight:600;font-size:13px">Строки для вставки</label><textarea class="inp" id="ed-paste" spellcheck="false"></textarea>' +
        '<div class="helper"><button class="btn btn-sm" id="ed-parse" type="button">Разобрать и подставить</button></div><div id="ed-report"></div>' +
      '</div></details>' +
    '</div>' +
    '<div class="sh-f"><p class="status" id="ed-status" role="status" aria-live="polite">Сохранение сразу видно всем, у кого открыто табло.</p>' +
      '<div class="acts"><button class="btn" id="ed-cancel" type="button">Отменить изменения</button><button class="btn btn-o" id="ed-save" type="button">Сохранить для всех</button></div></div>' +
    '</div></div>';

  const grid = document.getElementById('ed-grid');
  grid.addEventListener('input', onCellInput);
  grid.addEventListener('focusout', onCellBlur);
  document.getElementById('ed-goal').addEventListener('input', e => {
    const v = parseMoney(e.target.value), h = document.getElementById('ed-goal-h');
    if (Number.isNaN(v)) { h.textContent = 'Не похоже на число'; h.className = 'hint bad'; ed.bad.goal = true; }
    else { ed.goal = v == null ? 0 : v; delete ed.bad.goal; h.textContent = v == null ? '' : '= ' + money(v); h.className = 'hint'; }
    document.getElementById('ed-even-n').textContent = 'по ' + money(evenShare()) + ' на команду в день';
  });
  document.querySelectorAll('[data-edday]').forEach(b => b.addEventListener('click', () => {
    ed.day = b.dataset.edday;
    document.querySelectorAll('[data-edday]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.edday === ed.day)));
    grid.innerHTML = edRows();
  }));
  document.getElementById('ed-even').addEventListener('click', () => {
    const n = evenShare(); if (!(n > 0)) return;
    let c = 0;
    for (const t of S.teams) for (const d of S.days) if (!isNum(ed.values[t.id][d.date].plan)) { ed.values[t.id][d.date].plan = n; c++; }
    grid.innerHTML = edRows();
    setStatus(c ? 'Заполнено пустых планов: ' + c + '. Проверьте и сохраните.' : 'Пустых планов нет — ничего не изменилось.');
  });
  document.getElementById('ed-parse').addEventListener('click', () => {
    const res = parsePaste(document.getElementById('ed-paste').value, ed.day);
    res.ok.forEach(r => { const c = ed.values[r.tid][r.date]; if (r.plan !== undefined) c.plan = r.plan; if (r.fact !== undefined) c.fact = r.fact; });
    grid.innerHTML = edRows();
    let rep = '';
    if (res.ok.length) rep += '<p>Подставлено строк: ' + res.ok.length + '. Проверьте значения по дням и сохраните.</p>';
    if (res.bad.length) rep += '<ul class="plist">' + res.bad.map(b => '<li class="bad">Строка ' + b.n + ': ' + esc(b.why) + ' — «' + esc(b.line.slice(0, 60)) + '»</li>').join('') + '</ul>';
    if (!res.ok.length && !res.bad.length) rep = '<p>Вставьте строки в поле выше.</p>';
    document.getElementById('ed-report').innerHTML = rep;
  });
  document.getElementById('ed-x').addEventListener('click', () => closeEditor());
  document.getElementById('ed-cancel').addEventListener('click', () => { ed = null; closeEditor(); });
  document.getElementById('ed-save').addEventListener('click', save);
  document.getElementById('ed-scrim').addEventListener('click', e => { if (e.target.id === 'ed-scrim') closeEditor(); });
  document.addEventListener('keydown', onEsc);
  try { document.getElementById('ed-goal').focus({ preventScroll: true }); } catch (e) {}
}
function onEsc(e) { if (e.key === 'Escape' && document.getElementById('bc-editor')) closeEditor(); }
function closeEditor(silent) {
  const host = document.getElementById('bc-editor');
  if (host) host.remove();
  document.removeEventListener('keydown', onEsc);
  if (!silent && lastFocus && document.body.contains(lastFocus)) { try { lastFocus.focus(); } catch (e) {} }
}
function onCellInput(e) {
  const el = e.target; if (!el.dataset || !el.dataset.k) return;
  const v = parseMoney(el.value), h = document.getElementById(el.id + '-h'), key = el.id;
  if (Number.isNaN(v)) { h.textContent = 'Не похоже на число'; h.className = 'hint bad'; ed.bad[key] = true; return; }
  delete ed.bad[key];
  ed.values[el.dataset.t][el.dataset.d][el.dataset.k] = v;
  h.textContent = v == null ? '' : '= ' + money(v); h.className = 'hint';
}
function onCellBlur(e) {
  const el = e.target; if (!el.dataset || !el.dataset.k || ed.bad[el.id]) return;
  const v = ed.values[el.dataset.t][el.dataset.d][el.dataset.k];
  el.value = isNum(v) ? nf.format(v) : '';
}
function setStatus(msg, bad) { const s = document.getElementById('ed-status'); if (s) { s.textContent = msg; s.className = 'status' + (bad ? ' bad' : ''); } }

let saving = false;
async function save() {
  if (saving || !ed) return;
  if (Object.keys(ed.bad).length) { setStatus('Исправьте поля с ошибкой — они подсвечены красным.', true); return; }
  const byEl = document.getElementById('ed-by');
  const by = (byEl ? byEl.value : '').trim().slice(0, 40);
  if (by) lsSet(K_NAME, by);
  const entries = [];
  for (const t of S.teams) for (const d of S.days) {
    const was = S.values[t.id][d.date], now = ed.values[t.id][d.date], e = { team_id: t.id, day: d.date };
    if ((was.plan ?? null) !== (now.plan ?? null)) e.plan = now.plan ?? null;
    if ((was.fact ?? null) !== (now.fact ?? null)) e.fact = now.fact ?? null;
    if ('plan' in e || 'fact' in e) entries.push(e);
  }
  const body = { by, entries };
  if (isNum(ed.goal) && ed.goal !== S.goal) body.goal = ed.goal;
  if (!entries.length && !('goal' in body)) { setStatus('Изменений нет — сохранять нечего.'); return; }
  saving = true;
  const btn = document.getElementById('ed-save'); if (btn) btn.disabled = true;
  setStatus('Сохраняю…');
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    applyServer(j); loaded = true; loadErr = null; lastSync = new Date();
    ed = null; closeEditor(); renderMain();
    toast('Сохранено: ' + (entries.length ? entries.length + ' ' + plural(entries.length, 'ячейка', 'ячейки', 'ячеек') : 'цель'));
  } catch (e) {
    setStatus('Не удалось сохранить: ' + (e && e.message ? e.message : 'нет связи') + '. Цифры в форме остались — попробуйте ещё раз.', true);
  }
  saving = false; if (btn) btn.disabled = false;
}
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 3200);
}

/* ---------- boot ---------- */
(function start() {
  const saved = lsGet(K_SCOPE), t = todayISO();
  scope = (saved && (saved === 'all' || dayOf(saved))) ? saved : (dayOf(t) ? t : 'all');
  renderMain();
  load();
  setInterval(() => { if (!document.hidden && !document.getElementById('bc-editor')) load(); }, POLL_MS);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
})();
})();
</script></body></html>
